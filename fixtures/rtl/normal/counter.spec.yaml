# Counter DUT Behavior Specification

> DUT: fixtures/rtl/normal/counter.v
> Top Module: counter
> Purpose: Define expected behavior for self-checking testbench generation

---

## Top Module

```yaml
top_module: counter
```

---

## Clock and Reset

### Clock

```yaml
clock:
  signal: clk
  edge: posedge
  period_ns: 10
  frequency_hz: 100000000
```

### Reset

```yaml
reset:
  signal: rst_n
  active_level: low
  kind: async
  assertion_cycles: 3
```

**Reset Behavior:**
- When `rst_n == 0`, `count` must be `0` on the next clock edge
- Reset is asynchronous (takes effect immediately when `rst_n` goes low)
- Reset takes priority over enable

---

## Parameters

```yaml
parameters:
  - name: WIDTH
    default: 8
    description: Counter bit width
```

**Expected Behavior:**
- `count` range: `0` to `2^WIDTH - 1`
- When `WIDTH = 8`, range is `0` to `255`

---

## Expected Behavior

### Reset Scenario

```yaml
- when: rst_n == 0
  expect: count == 0
  description: Reset clears counter to zero
```

### Enable = 0 Scenario

```yaml
- when: rst_n == 1 and enable == 0
  expect: count_next == count
  description: Counter holds value when disabled
```

### Enable = 1 Scenario

```yaml
- when: rst_n == 1 and enable == 1
  expect: count_next == (count + 1) % (2^WIDTH)
  description: Counter increments by 1 each clock cycle
```

### Overflow Behavior

```yaml
- when: rst_n == 1 and enable == 1 and count == (2^WIDTH - 1)
  expect: count_next == 0
  description: Counter wraps around to zero after maximum value
```

---

## Test Sequence

### Basic Sequence

```yaml
sequence:
  - name: reset_test
    steps:
      - assert_rst_n: 0
      - wait_cycles: 5
      - check: count == 0

  - name: hold_test
    steps:
      - assert_rst_n: 1
      - assert_enable: 0
      - wait_cycles: 10
      - check: count == 0

  - name: increment_test
    steps:
      - assert_enable: 1
      - wait_cycles: 1
      - check: count == 1
      - wait_cycles: 1
      - check: count == 2
      - wait_cycles: 1
      - check: count == 3

  - name: overflow_test
    steps:
      - force_count: 255  # For WIDTH=8
      - assert_enable: 1
      - wait_cycles: 1
      - check: count == 0

  - name: disable_during_count
    steps:
      - force_count: 10
      - assert_enable: 1
      - wait_cycles: 1
      - check: count == 11
      - assert_enable: 0
      - wait_cycles: 5
      - check: count == 11
      - assert_enable: 1
      - wait_cycles: 1
      - check: count == 12
```

---

## Timing Constraints

### Setup and Hold

```yaml
timing:
  clk_period_ns: 10
  rst_assertion_before_clk: 5  # ns
  rst_assertion_after_clk: 5   # ns
  enable_setup: 1              # ns before clock edge
  enable_hold: 1               # ns after clock edge
```

---

## Known Limitations

1. **Overflow behavior**: Specification assumes wrap-around, but RTL implementation may vary
2. **Enable timing**: Changes to `enable` are assumed to be synchronous to clock edge
3. **Reset recovery**: No specific recovery time requirement specified

---

## Verification Methodology

### Self-Checking Strategy

1. **Reference Model**: Use a behavioral counter in SystemVerilog testbench
2. **Comparison**: Compare DUT `count` output with reference model on each clock edge
3. **Error Reporting**: Report mismatch with expected and actual values
4. **Test Completion**: End test after all sequences complete

### Pass/Fail Criteria

**PASS Conditions:**
- All check statements pass
- No mismatches between DUT and reference model
- Simulation reaches $finish without errors

**FAIL Conditions:**
- Any check statement fails
- Mismatch detected between DUT and reference model
- Timeout or unexpected $stop

